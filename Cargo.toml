[package]
name = "llmy"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Agent AI CLI yang ringan"
license = "GPL-3.0-only"
repository = "https://github.com/llm-y/agent"
homepage = "https://ll.my.id"

[features]
default = ["tls"]
# Tanpa ini hanya http:// (mis. Ollama lokal); juga dipakai untuk cek lintas target tanpa compiler C.
tls = ["dep:rustls", "dep:webpki-roots"]

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
regex-lite = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-width = { version = "0.2", default-features = false }
webpki-roots = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste", "windows"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
