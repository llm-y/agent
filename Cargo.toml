[package]
name = "llmy"
version = "0.1.0"
edition = "2024"
description = "Agent AI CLI yang ringan"
license-file = "LICENSE"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
unicode-width = { version = "0.2", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
